<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>You're offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff5e1 radial-gradient(rgb(23 20 15 / .09) 1px, transparent 1.2px) 0 0 / 22px 22px; color: #17140f; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 34rem; border: 2px solid #17140f; background: #fff; box-shadow: 6px 6px 0 #17140f; padding: 32px; }
    p.tag { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font: 400 clamp(2rem, 7vw, 3rem)/1 Georgia, "Times New Roman", serif; }
    mark { background: linear-gradient(transparent 58%, #ffb627 58%); color: inherit; }
    .row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 24px; }
    a, button { display: inline-flex; min-height: 46px; align-items: center; padding: 0 22px; border: 2px solid #17140f; box-shadow: 4px 4px 0 #17140f; font: 700 15px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    button { background: #c93a22; color: #fff; }
    a { background: #fff; color: #17140f; }
    :focus-visible { outline: 3px solid #17140f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="tag">No internet</p>
    <h1>You're <mark>offline.</mark></h1>
    <p>This page hasn't been saved on your device yet. Pages you've already visited still open without a connection — reconnect to load new ones, browse books or place an order.</p>
    <div class="row">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/">Go to home</a>
    </div>
  </main>
</body>
</html>
